name: Rebuild dist

on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'build.js'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

concurrency:
  group: rebuild-dist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dist
        run: npm run build

      - name: Commit regenerated dist
        run: |
          if git diff --quiet -- dist/; then
            echo "dist/ already up to date — nothing to commit."
            exit 0
          fi

          # Cache-bust the local dist/script/style URLs so browsers and the
          # Pages CDN can't keep serving a stale ChessPublica.all.min.js
          # after this rebuild — see the dnm/ "No moves found in PGN" bug
          # caused by a page holding onto a pre-fix cached bundle.
          SHA=$(git rev-parse --short HEAD)
          sed -i -E "s#(=\")(\.\./|/)(dist/ChessPublica\.all\.min\.(js|css)|styles\.css|script\.js)(\?v=[0-9a-f]+)?(\")#\1\2\3?v=${SHA}\6#g" index.html dnm/index.html

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ index.html dnm/index.html
          git commit -m "chore: auto-rebuild dist [skip ci]"
          git push
